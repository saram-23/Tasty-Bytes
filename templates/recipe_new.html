{% extends "base.html" %}

{% block title %}Add Recipe &middot; Tasty Bytes{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl">
  <div class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Add a New Recipe</h1>
    <p class="mt-1 text-sm text-slate-600">
      Save a recipe using known database ingredients so nutritional values are calculated automatically.
    </p>
  </div>

  <form action="/recipes/new" method="post" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6 sm:p-8 shadow-sm">
    <div>
      <label for="title" class="block text-sm font-medium text-slate-700">Recipe Title</label>
      <input
        id="title"
        name="title"
        type="text"
        required
        placeholder="e.g. Garlic Lemon Chicken Bowl"
        class="mt-1.5 w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label for="cooking_h" class="block text-sm font-medium text-slate-700">Cooking Hours</label>
        <input id="cooking_h" name="cooking_h" type="number" min="0" value="0" required class="mt-1.5 w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
      </div>
      <div>
        <label for="cooking_min" class="block text-sm font-medium text-slate-700">Cooking Minutes</label>
        <input id="cooking_min" name="cooking_min" type="number" min="0" max="59" value="25" required class="mt-1.5 w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
      </div>
      <div>
        <label for="servings" class="block text-sm font-medium text-slate-700">Servings</label>
        <input id="servings" name="servings" type="number" min="1" value="2" required class="mt-1.5 w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
      </div>
    </div>

    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="block text-sm font-medium text-slate-700">Ingredients</label>
        <button type="button" id="add-ingredient-row" class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 hover:bg-emerald-100 transition-colors">
          + Add Ingredient
        </button>
      </div>
      <div id="ingredient-rows" class="space-y-2.5">
        <div class="ingredient-row grid grid-cols-12 gap-2">
          <select name="ingredient_ids" required class="col-span-7 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
            {% for ingredient in ingredients %}
            <option value="{{ ingredient.ingredient_id }}">{{ ingredient.name | capitalize }}</option>
            {% endfor %}
          </select>
          <input name="quantities" type="number" min="1" step="0.1" value="100" required placeholder="Qty" class="col-span-3 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
          <input name="units" type="text" value="g" readonly class="col-span-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-center text-sm text-slate-600" />
        </div>
      </div>
    </div>

    <div>
      <label for="instructions" class="block text-sm font-medium text-slate-700">Instructions</label>
      <textarea
        id="instructions"
        name="instructions"
        rows="4"
        required
        placeholder="Describe the preparation and cooking steps..."
        class="mt-1.5 w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
      ></textarea>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2">
      <a href="/recipes" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">
        Cancel
      </a>
      <button type="submit" class="rounded-lg bg-emerald-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 transition-colors">
        Save Recipe
      </button>
    </div>
  </form>
</div>

<script>
  (function () {
    const container = document.getElementById("ingredient-rows");
    const addBtn = document.getElementById("add-ingredient-row");

    addBtn.addEventListener("click", function () {
      const firstRow = container.querySelector(".ingredient-row");
      const clone = firstRow.cloneNode(true);
      clone.querySelector('input[name="quantities"]').value = "100";
      container.appendChild(clone);
    });
  })();
</script>
{% endblock %}
